name: madar_al_huda
description: "Madar Al-Huda (مدار الهدى) — a free, bilingual Islamic companion."
publish_to: 'none'

# versionName+versionCode. Bump per release; see plan/PHASE_06_RELEASE.md.
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

# Dependencies are pinned to exact versions (see plan/DECISIONS.md, D-12).
# pubspec.lock is committed. Upgrade deliberately, in a dedicated PR.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  intl: 0.20.3
  material_ui: 1.11.1
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  # Generates lib/core/localization/generated/ from the ARB files (l10n.yaml).
  generate: true

  # UI typeface candidate from docs/BRAND.md, licensed under SIL OFL 1.1
  # (assets/fonts/ibm_plex_sans_arabic/OFL.txt). Covers Arabic and Latin.
  # This is NOT a Quran typeface; Quran text requires an approved Uthmani font.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/ibm_plex_sans_arabic/OFL.txt
